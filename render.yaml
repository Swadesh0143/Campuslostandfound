# ==============================================================================
# CampusFind - Render Cloud Infrastructure Blueprint (render.yaml)
# ==============================================================================
# Deploys:
#   1. campusfind-backend  -> Node.js API Web Service (Free Tier)
#   2. campusfind-frontend -> React 18 + Vite Static SPA Site (Free Tier)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend REST API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: campusfind-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix backend install
    startCommand: node backend/src/dev-server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Enables built-in serverless database simulation if AWS credentials are not configured
      - key: LOCAL_DEV
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
      # Optional: configure AWS credentials in Render dashboard to connect to live AWS
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: TABLE_ITEMS
        value: CampusFind-Items
      - key: TABLE_OWNERSHIP
        value: CampusFind-Ownership
      - key: TABLE_REPORTS
        value: CampusFind-AbuseReports
      - key: S3_BUCKET
        value: campusfind-item-images

  # ----------------------------------------------------------------------------
  # 2. Frontend React Single Page Application (Static Site)
  # ----------------------------------------------------------------------------
  - type: static
    name: campusfind-frontend
    plan: free
    region: oregon
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      # Single Page Application (SPA) client-side routing fallback rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CAMPUS_NAME
        value: "Metropolitan University"
      - key: VITE_APP_NAME
        value: "CampusFind"
      - key: VITE_APP_TAGLINE
        value: "Lost something? Let's find it."
      - key: VITE_MAX_IMAGE_SIZE_MB
        value: "5"
      # Automatically links to the deployed backend URL host
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: campusfind-backend
          property: host
