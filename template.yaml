AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CampusFind - Cloud-Based Campus Lost & Found System
  Serverless Architecture with API Gateway HTTP API, Lambda (Node.js 20), DynamoDB (On-Demand), S3 Private Bucket & Cognito.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, test, prod]
    Description: Deployment environment stage.
  AppName:
    Type: String
    Default: campusfind
    Description: Name of the application (lowercase for S3 compliance).

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: production
        TABLE_ITEMS: !Ref ItemsTable
        TABLE_OWNERSHIP: !Ref OwnershipTable
        TABLE_REPORTS: !Ref AbuseReportsTable
        S3_BUCKET: !Ref ImagesBucket
        COGNITO_USER_POOL_ID: !Ref AdminUserPool
        COGNITO_CLIENT_ID: !Ref AdminUserPoolClient
        CORS_ORIGIN: '*'

Resources:
  # ===================================================================
  # 1. API GATEWAY HTTP API (Pay per million requests, ~$1.00/M)
  # ===================================================================
  CampusFindHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Management-Token
          - X-Requested-With
        MaxAge: 300

  # ===================================================================
  # 2. AWS LAMBDA FUNCTION (Serverless Compute)
  # ===================================================================
  CampusFindApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/lambda.handler
      Description: Core Lambda handler routing HTTP API requests to DynamoDB, S3, and Cognito
      Policies:
        # Least privilege DynamoDB policy for the 3 tables and indexes
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OwnershipTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AbuseReportsTable
        # Least privilege S3 policy for the private images bucket
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
        # Cognito GetUser access policy for JWT validation
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: !GetAtt AdminUserPool.Arn
      Events:
        # Root health check
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /
            Method: GET
        HealthEndpoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /health
            Method: GET
        # Public Stats
        StatsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /stats
            Method: GET
        # Items CRUD
        ListItemsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /items
            Method: GET
        CreateItemRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /items
            Method: POST
        GetItemRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /items/{itemId}
            Method: GET
        DeleteItemRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /items/{itemId}
            Method: DELETE
        # S3 Presigned Upload
        PresignUploadRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /uploads/presign
            Method: POST
        # Contact Privacy
        ContactRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /contact/{itemId}
            Method: GET
        # Ownership Token Verification & Status Updates
        ManageVerifyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /manage/{itemId}/verify
            Method: POST
        UpdateStatusRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /items/{itemId}/status
            Method: PATCH
        # Abuse Reporting
        ReportAbuseRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /items/{itemId}/report
            Method: POST
        # Admin Operations
        AdminItemsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /admin/items
            Method: GET
        AdminItemModerationRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /admin/items/{itemId}/moderation
            Method: PATCH
        AdminReportsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /admin/reports
            Method: GET
        AdminResolveReportRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CampusFindHttpApi
            Path: /admin/reports/{reportId}
            Method: PATCH

  # ===================================================================
  # 3. AMAZON DYNAMODB TABLES (On-Demand Capacity = $0 idle cost)
  # ===================================================================
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-Items-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: type
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: itemId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: TypeCreatedAtIndex
          KeySchema:
            - AttributeName: type
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false # disabled to save on student credit charges

  OwnershipTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-Ownership-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: itemId
          KeyType: HASH

  AbuseReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-AbuseReports-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH

  # ===================================================================
  # 4. AMAZON S3 PRIVATE BUCKET (Images & Uploads)
  # ===================================================================
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-images-${AWS::AccountId}-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ===================================================================
  # 5. AMAZON COGNITO USER POOL (Admin Authentication)
  # ===================================================================
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AppName}-AdminUsers-${Environment}"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true # Prevents unauthorized public signups to admin portal
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppName}-Frontend-Client-${Environment}"
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false # Must be false for browser SPA client
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ===================================================================
  # 6. AMAZON CLOUDWATCH LOG GROUP (14-Day Retention Cost Safeguard)
  # ===================================================================
  CampusFindLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CampusFindApiFunction}"
      RetentionInDays: 14

Outputs:
  HttpApiUrl:
    Description: HTTP API Gateway Production Base URL
    Value: !Sub "https://${CampusFindHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AppName}-ApiUrl-${Environment}"

  ImagesBucketName:
    Description: Private Amazon S3 Bucket Name for item images
    Value: !Ref ImagesBucket
    Export:
      Name: !Sub "${AppName}-Bucket-${Environment}"

  ItemsTableName:
    Description: DynamoDB Items Table
    Value: !Ref ItemsTable

  OwnershipTableName:
    Description: DynamoDB Ownership Table
    Value: !Ref OwnershipTable

  AbuseReportsTableName:
    Description: DynamoDB Abuse Reports Table
    Value: !Ref AbuseReportsTable

  CognitoUserPoolId:
    Description: Amazon Cognito User Pool ID for Admin Auth
    Value: !Ref AdminUserPool

  CognitoClientId:
    Description: Amazon Cognito App Client ID for Frontend
    Value: !Ref AdminUserPoolClient

  AwsRegion:
    Description: Deployment AWS Region
    Value: !Ref "AWS::Region"
